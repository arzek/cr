<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#a855f7" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Glow effect behind CR -->
  <circle cx="600" cy="240" r="180" fill="#a855f7" opacity="0.06"/>
  <circle cx="600" cy="240" r="120" fill="#a855f7" opacity="0.04"/>

  <!-- CR Logo -->
  <text x="600" y="270" font-family="'Courier New', monospace" font-size="160" font-weight="bold" fill="url(#purple)" text-anchor="middle">CR</text>

  <!-- Terminal prompt -->
  <rect x="340" y="310" width="520" height="50" rx="8" fill="#1e1235" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
  <text x="360" y="343" font-family="'Courier New', monospace" font-size="22" fill="#666">$</text>
  <text x="385" y="343" font-family="'Courier New', monospace" font-size="22" fill="#e2e8f0">cr</text>
  <text x="420" y="343" font-family="'Courier New', monospace" font-size="22" fill="#a855f7"> --ai</text>

  <!-- Three AI boxes -->
  <!-- Claude -->
  <rect x="240" y="400" width="200" height="65" rx="10" fill="#1e1235" stroke="#a855f7" stroke-width="1.5"/>
  <text x="340" y="428" font-family="'Courier New', monospace" font-size="16" fill="#a855f7" text-anchor="middle">Claude</text>
  <text x="340" y="450" font-family="'Courier New', monospace" font-size="13" fill="#22c55e" text-anchor="middle">2 issues found</text>

  <!-- Gemini -->
  <rect x="500" y="400" width="200" height="65" rx="10" fill="#1e1235" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="428" font-family="'Courier New', monospace" font-size="16" fill="#3b82f6" text-anchor="middle">Gemini</text>
  <text x="600" y="450" font-family="'Courier New', monospace" font-size="13" fill="#22c55e" text-anchor="middle">1 issue found</text>

  <!-- Codex -->
  <rect x="760" y="400" width="200" height="65" rx="10" fill="#1e1235" stroke="#22c55e" stroke-width="1.5"/>
  <text x="860" y="428" font-family="'Courier New', monospace" font-size="16" fill="#22c55e" text-anchor="middle">Codex</text>
  <text x="860" y="450" font-family="'Courier New', monospace" font-size="13" fill="#22c55e" text-anchor="middle">No issues</text>

  <!-- Connecting lines -->
  <line x1="600" y1="360" x2="340" y2="400" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="360" x2="600" y2="400" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="360" x2="860" y2="400" stroke="#22c55e" stroke-width="1" opacity="0.4"/>

  <!-- Tagline -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">3 AI reviewers. 1 command. 0 trust issues.</text>

  <!-- Parallel badge -->
  <rect x="490" y="550" width="220" height="30" rx="15" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <text x="600" y="570" font-family="'Courier New', monospace" font-size="14" fill="#a855f7" text-anchor="middle" opacity="0.7">parallel &#x00B7; streaming</text>
</svg>
